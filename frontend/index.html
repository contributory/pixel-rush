<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060f" />
    <title>PIXEL RUSH — Shoot'em Up Co-op</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L22 16 L30 26 L19 23 L16 30 L13 23 L2 26 L10 16 Z' fill='%2300f0ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind v4 runtime (no build step) — compiles the <style> block below -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";

      @theme {
        --font-display: "Press Start 2P", "Courier New", monospace;
        --font-body: "Chakra Petch", "Trebuchet MS", sans-serif;
        --color-ink: #05060f;
        --color-deep: #0a0e24;
        --color-panel: #0d1230;
        --color-line: #24306b;
        --color-neon: #00f0ff;
        --color-hot: #ff2d78;
        --color-gold: #ffd23f;
        --color-acid: #7dff5e;
        --color-dim: #8ea0d8;
        --color-snow: #eaf6ff;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        background: #05060f;
        color: #eaf6ff;
        font-family: var(--font-body);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: #ff2d78;
        color: #fff;
      }

      /* ---------- CRT / arcade overlays ---------- */
      .fx-scan {
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.16) 0px,
          rgba(0, 0, 0, 0.16) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: multiply;
      }
      .fx-vignette {
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 4, 14, 0.82) 100%);
      }

      /* ---------- keyframes ---------- */
      @keyframes blink {
        0%, 54% { opacity: 1; }
        55%, 100% { opacity: 0; }
      }
      .blink { animation: blink 1.05s steps(1) infinite; }

      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .marquee-track {
        display: inline-flex;
        white-space: nowrap;
        animation: marquee 26s linear infinite;
      }

      @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        60% { transform: scale(1.12); opacity: 1; }
        100% { transform: scale(1); }
      }
      .pop-in { animation: popIn 0.28s cubic-bezier(0.2, 1.4, 0.4, 1) both; }

      @keyframes slideUp {
        from { transform: translateY(18px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .slide-up { animation: slideUp 0.4s cubic-bezier(0.2, 1, 0.3, 1) both; }

      @keyframes radar {
        to { transform: rotate(360deg); }
      }
      .radar { animation: radar 1.1s linear infinite; }

      @keyframes comboPop {
        0% { transform: scale(1.7); }
        100% { transform: scale(1); }
      }
      .combo-pop { animation: comboPop 0.18s ease-out both; }

      @keyframes eqBar {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }
      .eq-bar {
        transform-origin: bottom;
        animation: eqBar 0.7s ease-in-out infinite;
      }

      @keyframes titleFloat {
        0%, 100% { transform: rotate(-2deg) translateY(0); }
        50% { transform: rotate(-2deg) translateY(-7px); }
      }
      .title-float { animation: titleFloat 4.5s ease-in-out infinite; }

      @keyframes glowPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .glow-pulse { animation: glowPulse 2.2s ease-in-out infinite; }

      /* ---------- components ---------- */
      .keycap {
        font-family: var(--font-display);
        font-size: 9px;
        line-height: 1;
        color: #eaf6ff;
        background: #131a42;
        border: 1px solid #33408c;
        border-bottom-width: 3px;
        border-radius: 4px;
        padding: 5px 7px 4px;
        display: inline-block;
        min-width: 24px;
        text-align: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }

      .panel-clip {
        clip-path: polygon(
          14px 0, 100% 0, 100% calc(100% - 14px),
          calc(100% - 14px) 100%, 0 100%, 0 14px
        );
      }

      .title-neon {
        color: #eaf6ff;
        text-shadow:
          3px 3px 0 #ff2d78,
          7px 7px 0 rgba(0, 240, 255, 0.32),
          0 0 26px rgba(0, 240, 255, 0.55);
      }

      .btn-arcade {
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border: 2px solid currentColor;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.55);
        transition: transform 0.09s ease, box-shadow 0.09s ease, background 0.15s ease, color 0.15s ease;
        cursor: pointer;
        user-select: none;
      }
      .btn-arcade:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 7px 0 rgba(0, 0, 0, 0.55);
      }
      .btn-arcade:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
      }
      .btn-arcade:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .hud-chip {
        background: rgba(8, 11, 30, 0.82);
        border: 1px solid rgba(51, 64, 140, 0.8);
        backdrop-filter: blur(3px);
      }

      .scroll-slim::-webkit-scrollbar { width: 6px; }
      .scroll-slim::-webkit-scrollbar-thumb { background: #24306b; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Error debugging: show client-side errors on screen -->
    <script src="https://esm.town/v/std/catch"></script>
    <!-- Entry: no bundling — each module is served & transpiled individually -->
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
